<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Ananya's Playlist</title>
<link rel="icon" type="image/png" href="assets/favicon.jpg">

<meta name="description" content="Songs for the days you need a little sunshine." />

<!-- Fonts: Fraunces (expressive serif for the title), Caveat (handwritten touches), Karla (clean functional UI type) -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,600;1,9..144,500&family=Caveat:wght@500;600&family=Karla:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/animations.css" />
</head>
<body>

<div class="scene" id="scene">

  <!-- ============ LIVING BACKGROUND ============ -->
  <div class="bg-layer" id="bgLayer">
    <div class="artwork-zoom" id="artworkZoom">
      <img
        class="artwork"
        src="assets/images/ananyabg.png"
        alt="Ananya, wearing headphones and glasses, smiling in a sunflower field under warm golden light"
      />
    </div>
    <div class="title-scrim" aria-hidden="true"></div>
    <div class="glow"></div>
    <div class="lens-flare" id="lensFlare"></div>
    <div class="particles" id="particles" aria-hidden="true"></div>
    <div class="vignette"></div>
    <div class="grain" aria-hidden="true"></div>
  </div>

  <!-- ============ TITLE ============ -->
  <header class="hero-title">
    <h1 class="title">
      <span class="title-main">Ananya&rsquo;s</span>
      <span class="title-sub">playlist</span>
    </h1>
    <p class="tagline">Songs for the days you need a little sunshine.</p>
  </header>

  <!-- ============ THE NOTE ============ -->
  <button class="note-trigger" id="noteTrigger" aria-haspopup="dialog">
    <span class="note-trigger-icon">✉</span>
    <span class="note-trigger-text">If today feels heavy&hellip;</span>
  </button>

  <!-- ============ SOCIAL ============ -->
  <a
    class="social-link"
    href="https://www.instagram.com/ananya_mishra07"
    target="_blank"
    rel="noopener noreferrer"
  >
    instagram <span class="social-sun">☀</span>
  </a>

  <!-- ============ PLAYLIST TRIGGER ============ -->
  <button
    class="playlist-trigger"
    id="playlistTrigger"
    aria-expanded="false"
    aria-controls="playlistPanel"
  >
    <span class="playlist-trigger-lines" aria-hidden="true"><i></i><i></i><i></i></span>
    Playlist
  </button>

  <!-- ============ PLAYER ============ -->
  <footer class="player" id="player">
    <div class="player-glass">

      <div class="player-track-info">
        <div class="mini-visualizer" id="visualizer" aria-hidden="true">
          <span></span><span></span><span></span><span></span>
        </div>
        <div class="track-meta">
          <p class="track-title" id="trackTitle">&nbsp;</p>
          <p class="track-artist" id="trackArtist">&nbsp;</p>
        </div>
      </div>

      <div class="player-main">
        <div class="player-controls">
          <button id="prevBtn" class="ctrl-btn" aria-label="Previous song" title="Previous">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 5h2v14H6zM20 5v14L9 12z" fill="currentColor"/></svg>
          </button>
          <button id="playBtn" class="ctrl-btn play-btn" aria-label="Play">
            <svg class="icon-play" viewBox="0 0 24 24" width="20" height="20"><path d="M8 5v14l12-7z" fill="currentColor"/></svg>
            <svg class="icon-pause" viewBox="0 0 24 24" width="20" height="20" hidden><path d="M7 5h4v14H7zM13 5h4v14h-4z" fill="currentColor"/></svg>
          </button>
          <button id="nextBtn" class="ctrl-btn" aria-label="Next song" title="Next">
            <svg viewBox="0 0 24 24" width="18" height="18"><path d="M16 5h2v14h-2zM4 5v14l11-7z" fill="currentColor"/></svg>
          </button>
        </div>

        <div class="player-progress">
          <span class="time current" id="currentTime">0:00</span>
          <input type="range" id="seekBar" class="seek-bar" min="0" max="100" value="0" step="0.1" aria-label="Seek through song" />
          <span class="time duration" id="duration">0:00</span>
        </div>
      </div>

      <div class="player-volume">
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/></svg>
        <input type="range" id="volumeBar" class="volume-bar" min="0" max="1" step="0.01" value="0.65" aria-label="Volume" />
      </div>

    </div>
  </footer>

  <!-- ============ PLAYLIST PANEL ============ -->
  <aside class="playlist-panel" id="playlistPanel" aria-hidden="true">
    <div class="playlist-panel-header">
      <h2>Playlist</h2>
      <button class="playlist-close" id="playlistClose" aria-label="Close playlist">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/></svg>
      </button>
    </div>
    <ol class="playlist-list" id="playlistList"></ol>
  </aside>
  <div class="scrim" id="scrim"></div>

  <!-- ============ THE LETTER ============ -->
  <div class="letter-overlay" id="letterOverlay" role="dialog" aria-modal="true" aria-label="A note for you" aria-hidden="true">
    <div class="letter-scene">
      <div class="envelope" id="envelope">
        <div class="envelope-body">
          <div class="envelope-flap-back"></div>
          <div class="letter-paper" id="letterPaper">
            <div class="letter-text" id="letterText"></div>
            <button class="letter-close" id="letterClose">close, gently</button>
          </div>
          <div class="envelope-flap-front"></div>
          <div class="envelope-seal">✉</div>
        </div>
      </div>
    </div>
  </div>

</div>

<audio id="audioEl" preload="metadata"></audio>

<script src="js/playlist-data.js"></script>
<script src="js/notes-data.js"></script>
<script src="js/player.js"></script>
<script src="js/main.js"></script>
</body>
</html>
